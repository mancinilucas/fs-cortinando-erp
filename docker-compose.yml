services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cortinas_user
      POSTGRES_PASSWORD: cortinas_password
      POSTGRES_DB: cortinas_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortinas_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://cortinas_user:cortinas_password@postgres:5432/cortinas_db"
      JWT_SECRET: "your-secret-key-change-in-production"
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: npm run start:dev

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:3000"
    volumes:
      - ./frontend:/app
    command: npm run dev

volumes:
  postgres_data:
